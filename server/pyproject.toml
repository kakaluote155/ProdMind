[project]
name = "prodmind-server"
version = "1.0.0"
description = "Evidence-first AI production support server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "ProdMind contributors" },
]
keywords = ["opentelemetry", "production-support", "root-cause-analysis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "httpx>=0.28,<1.0",
]

[project.scripts]
prodmind-server = "app.cli:main"

[project.urls]
Homepage = "https://github.com/kakaluote155/ProdMind"
Repository = "https://github.com/kakaluote155/ProdMind"
Issues = "https://github.com/kakaluote155/ProdMind/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ai_eval_cases.json"]
