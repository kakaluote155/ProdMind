name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: integrations/spring-boot-starter/pom.xml

      - name: Install build dependencies
        run: pip install -e "./server[dev]" -e "./integrations/python[dev]"

      - name: Build checksummed installable artifacts
        run: python scripts/build-release.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' artifacts < <(find "release/$(cat VERSION)" -type f -print0)
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" \
              --verify-tag \
              --notes-file "$notes_file" \
              --title "ProdMind $(cat VERSION)"
          else
            gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" \
              --verify-tag \
              --generate-notes \
              --title "ProdMind $(cat VERSION)"
          fi
