name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run AI Investigator quality gates
        run: python -m app.ai_eval

  widget-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install widget dependencies
        run: npm ci

      - name: Type-check widget SDK
        run: npm run typecheck

      - name: Test widget SDK
        run: npm test

      - name: Build widget SDK
        run: npm run build

  python-integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration dependencies
        run: pip install -e ".[dev]"

      - name: Test Python integration
        run: pytest -q

  spring-boot-starter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/spring-boot-starter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: integrations/spring-boot-starter/pom.xml

      - name: Test Spring Boot Starter
        run: mvn -q test

  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: integrations/spring-boot-starter/pom.xml

      - name: Install Python build dependencies
        run: pip install -e "./server[dev]" -e "./integrations/python[dev]"

      - name: Build and verify release artifacts
        run: python scripts/build-release.py

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: prodmind-${{ github.ref_name }}-release
          path: release/
          if-no-files-found: error

  production-compose-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Docker Compose
        run: >-
          docker compose
          --env-file .env.production.example
          -f docker-compose.production.yml
          config

  demo-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/user-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: demo/user-service/pom.xml

      - name: Compile demo service
        run: mvn -q -DskipTests package

  compose-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run end-to-end incident investigation
        run: bash scripts/e2e-smoke.sh

      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prodmind-e2e-logs
          path: /tmp/prodmind-compose.log
          if-no-files-found: ignore

  change-awareness-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deployment/change awareness E2E
        run: bash scripts/e2e-change-awareness.sh

      - name: Upload change-awareness stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prodmind-change-e2e-logs
          path: /tmp/prodmind-change-e2e.log
          if-no-files-found: ignore

  multiservice-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run multi-service critical-path E2E
        run: bash scripts/e2e-multiservice.sh

      - name: Upload multi-service stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prodmind-multiservice-e2e-logs
          path: /tmp/prodmind-multiservice-e2e.log
          if-no-files-found: ignore
