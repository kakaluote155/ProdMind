name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.116,<1.0" "pydantic>=2.11,<3.0" "httpx>=0.28,<1.0" "pytest>=8.4,<9.0"

      - name: Run tests
        run: pytest -q
