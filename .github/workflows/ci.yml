name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  widget-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install widget dependencies
        run: npm install

      - name: Build widget SDK
        run: npm run build

  demo-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/user-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: demo/user-service/pom.xml

      - name: Compile demo service
        run: mvn -q -DskipTests package

  compose-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run end-to-end incident investigation
        run: bash scripts/e2e-smoke.sh

      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prodmind-e2e-logs
          path: /tmp/prodmind-compose.log
          if-no-files-found: ignore

  change-awareness-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deployment/change awareness E2E
        run: bash scripts/e2e-change-awareness.sh

      - name: Upload change-awareness stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prodmind-change-e2e-logs
          path: /tmp/prodmind-change-e2e.log
          if-no-files-found: ignore
