services:
  postgres:
    image: postgres:16-alpine
    container_name: prodmind-postgres
    environment:
      POSTGRES_DB: prodmind_demo
      POSTGRES_USER: prodmind
      POSTGRES_PASSWORD: prodmind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodmind -d prodmind_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - prodmind-postgres:/var/lib/postgresql/data

  tempo:
    image: grafana/tempo:2.6.1
    container_name: prodmind-tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./deploy/tempo.yml:/etc/tempo.yml:ro
      - prodmind-tempo:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.4.2
    container_name: prodmind-loki
    command: ["-config.file=/etc/loki/local-config.yml"]
    volumes:
      - ./deploy/loki.yml:/etc/loki/local-config.yml:ro
      - prodmind-loki:/loki
    ports:
      - "3100:3100"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: prodmind-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./deploy/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - tempo
      - loki
    ports:
      - "4317:4317"
      - "4318:4318"

  demo-user-service:
    build:
      context: ./demo/user-service
    container_name: prodmind-demo-user-service
    environment:
      DEMO_DB_URL: jdbc:postgresql://postgres:5432/prodmind_demo
      DEMO_DB_USER: prodmind
      DEMO_DB_PASSWORD: prodmind
      PRODMIND_PROJECT_ID: demo
      OTEL_SERVICE_NAME: demo-user-service
      OTEL_RESOURCE_ATTRIBUTES: prodmind.project.id=demo
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8090:8090"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prodmind-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prodmind-prometheus:/prometheus
    depends_on:
      demo-user-service:
        condition: service_started
    ports:
      - "9090:9090"

  prodmind-server:
    build:
      context: ./server
    container_name: prodmind-server
    environment:
      PRODMIND_ENV: ${PRODMIND_ENV:-development}
      PRODMIND_LOG_LEVEL: ${PRODMIND_LOG_LEVEL:-INFO}
      PRODMIND_LLM_PROVIDER: ${PRODMIND_LLM_PROVIDER:-disabled}
      PRODMIND_LLM_MODEL: ${PRODMIND_LLM_MODEL:-}
      PRODMIND_LLM_API_KEY: ${PRODMIND_LLM_API_KEY:-}
      PRODMIND_TEMPO_URL: http://tempo:3200
      PRODMIND_LOKI_URL: http://loki:3100
      PRODMIND_PROMETHEUS_URL: http://prometheus:9090
      PRODMIND_MEMORY_PATH: /data/prodmind-memory.db
      PRODMIND_ENGINEER_API_KEY: ${PRODMIND_ENGINEER_API_KEY:-demo-engineer-key}
    depends_on:
      - tempo
      - loki
      - prometheus
    ports:
      - "${PRODMIND_API_PORT:-8088}:8088"
    volumes:
      - prodmind-memory:/data
    restart: unless-stopped

volumes:
  prodmind-postgres:
  prodmind-tempo:
  prodmind-loki:
  prodmind-prometheus:
  prodmind-memory:
