<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ProdMind — Evidence-first AI Production Support Engineer</title>
  <desc id="desc">Futuristic neon hero banner showing User Action to Trace Logs Metrics to Evidence to Root Cause.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".46" stop-color="#07152d"/><stop offset="1" stop-color="#17052e"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#20e3ff"/><stop offset=".48" stop-color="#238cff"/><stop offset="1" stop-color="#c337ff"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#31e7ff"/><stop offset="1" stop-color="#df35ff"/></linearGradient>
    <radialGradient id="nova"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".15" stop-color="#3ae8ff" stop-opacity=".85"/><stop offset=".45" stop-color="#7d3cff" stop-opacity=".32"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#2c6cff" stroke-opacity=".13" stroke-width="1"/></pattern>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="182" r="260" fill="url(#nova)" opacity=".78"/>
  <circle cx="1175" cy="520" r="210" fill="#a31cff" opacity=".11" filter="url(#soft)"/>
  <circle cx="250" cy="600" r="240" fill="#00d9ff" opacity=".08" filter="url(#soft)"/>
  <path d="M0 530 C260 420 410 630 690 500 S1080 420 1280 520" fill="none" stroke="#21e7ff" stroke-opacity=".42" stroke-width="3" filter="url(#glow)"/>
  <path d="M0 565 C300 450 520 650 795 510 S1110 470 1280 555" fill="none" stroke="#d83cff" stroke-opacity=".52" stroke-width="3" filter="url(#glow)"/>

  <g opacity=".85" fill="#bdefff">
    <circle cx="65" cy="70" r="2"/><circle cx="360" cy="92" r="1.7"/><circle cx="618" cy="55" r="1.4"/><circle cx="796" cy="88" r="1.5"/><circle cx="1110" cy="65" r="2.1"/><circle cx="1217" cy="155" r="1.3"/>
  </g>

  <g transform="translate(58 48)">
    <rect width="560" height="98" rx="20" fill="#071425" fill-opacity=".92" stroke="url(#neon)" stroke-width="2.4" filter="url(#glow)"/>
    <g transform="translate(24 18)" fill="none" stroke="url(#neon)" stroke-width="3">
      <rect x="0" y="0" width="62" height="62" rx="18"/>
      <path d="M31 10v42M17 18c-9 5-9 17 0 22m28-22c9 5 9 17 0 22M22 13c-7 0-10 6-8 12m26-12c7 0 10 6 8 12M18 42c-3 9 5 14 13 11m13-11c3 9-5 14-13 11"/>
    </g>
    <text x="110" y="66" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="800">Prod<tspan fill="url(#neon)">Mind</tspan></text>
  </g>

  <text x="64" y="220" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="800">Software that knows</text>
  <text x="64" y="278" fill="url(#neon)" font-family="Segoe UI,Arial,sans-serif" font-size="54" font-weight="900">why it broke —</text>
  <text x="64" y="336" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="49" font-weight="800">or <tspan fill="url(#violet)">why it got slow.</tspan></text>
  <rect x="65" y="359" width="5" height="34" rx="3" fill="url(#violet)"/>
  <text x="84" y="386" fill="#dbeafe" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="500">Evidence-first AI Production Support Engineer</text>

  <g transform="translate(725 50)">
    <rect width="493" height="320" rx="26" fill="#061326" fill-opacity=".72" stroke="url(#neon)" stroke-width="2.2" filter="url(#glow)"/>
    <text x="28" y="42" fill="#4be9ff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">AI ANALYSIS</text>
    <circle cx="77" cy="95" r="34" fill="none" stroke="url(#violet)" stroke-width="3"/>
    <path d="M77 66v58M58 76c-14 12-9 37 7 41m31-41c14 12 9 37-7 41" fill="none" stroke="url(#violet)" stroke-width="3"/>
    <text x="130" y="87" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="800">Root cause identified.</text>
    <text x="132" y="117" fill="#36e9ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">✓ Confidence 98%</text>

    <g transform="translate(28 150)">
      <rect width="206" height="76" rx="12" fill="#071b34" stroke="#2acfff" stroke-opacity=".7"/>
      <text x="12" y="18" fill="#b7eaff" font-size="11" font-family="Arial">LATENCY</text>
      <polyline points="12,58 35,51 54,56 76,40 98,48 122,25 145,47 166,32 194,39" fill="none" stroke="#28ddff" stroke-width="2.5" filter="url(#glow)"/>
    </g>
    <g transform="translate(248 150)">
      <rect width="216" height="76" rx="12" fill="#071b34" stroke="#c03aff" stroke-opacity=".7"/>
      <text x="12" y="18" fill="#e7c7ff" font-size="11" font-family="Arial">ERROR RATE</text>
      <polyline points="12,58 28,41 43,55 59,30 74,53 93,35 111,50 130,29 149,46 171,36 200,44" fill="none" stroke="#e448ff" stroke-width="2.5" filter="url(#glow)"/>
    </g>
    <g transform="translate(28 242)">
      <rect width="436" height="50" rx="12" fill="#071b34" stroke="#2acfff" stroke-opacity=".45"/>
      <text x="12" y="17" fill="#b7eaff" font-size="11" font-family="Arial">TRACE · LOGS · METRICS · SERVICE MAP</text>
      <g fill="#26cfff"><rect x="18" y="27" width="9" height="13"/><rect x="34" y="22" width="9" height="18"/><rect x="50" y="29" width="9" height="11"/><rect x="66" y="18" width="9" height="22"/><rect x="82" y="25" width="9" height="15"/><rect x="98" y="14" width="9" height="26"/></g>
      <g stroke="#b743ff" stroke-width="2" fill="#071b34"><circle cx="330" cy="32" r="7"/><circle cx="370" cy="22" r="7"/><circle cx="405" cy="35" r="7"/><path d="M337 30l26-6m14 2l21 7m-34-5l-21 5"/></g>
    </g>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="19">
    <g transform="translate(62 432)"><rect width="248" height="84" rx="18" fill="#07152b" fill-opacity=".9" stroke="#21e7ff" stroke-width="2"/><circle cx="44" cy="42" r="20" fill="none" stroke="#21e7ff" stroke-width="3"/><path d="M44 29v15m-11 12c4-9 18-9 22 0" stroke="#21e7ff" stroke-width="3" fill="none"/><text x="81" y="49" fill="#fff">User Action</text></g>
    <text x="327" y="486" fill="#41eaff" font-size="34">→</text>
    <g transform="translate(366 432)"><rect width="280" height="84" rx="18" fill="#07152b" fill-opacity=".9" stroke="url(#neon)" stroke-width="2"/><circle cx="45" cy="42" r="21" fill="none" stroke="#30dcff" stroke-width="3"/><path d="M28 43h8l5-13 8 25 7-16h9" fill="none" stroke="#30dcff" stroke-width="3"/><text x="82" y="36" fill="#fff">Trace · Logs</text><text x="82" y="62" fill="#fff">· Metrics</text></g>
    <text x="663" y="486" fill="#41eaff" font-size="34">→</text>
    <g transform="translate(702 432)"><rect width="230" height="84" rx="18" fill="#07152b" fill-opacity=".9" stroke="#824cff" stroke-width="2"/><path d="M44 22l18 8v14c0 11-7 20-18 25-11-5-18-14-18-25V30z" fill="none" stroke="#4feaff" stroke-width="3"/><path d="M35 44l7 7 12-14" fill="none" stroke="#4feaff" stroke-width="3"/><text x="83" y="50" fill="#fff">Evidence</text></g>
    <text x="948" y="486" fill="#d94dff" font-size="34">→</text>
    <g transform="translate(988 432)"><rect width="230" height="84" rx="18" fill="#07152b" fill-opacity=".9" stroke="#e044ff" stroke-width="2"/><circle cx="43" cy="42" r="19" fill="none" stroke="#e64aff" stroke-width="3"/><circle cx="43" cy="42" r="9" fill="none" stroke="#e64aff" stroke-width="3"/><path d="M43 42l17-17" stroke="#e64aff" stroke-width="3"/><text x="82" y="50" fill="#fff">Root Cause</text></g>
  </g>

  <text x="64" y="578" fill="url(#violet)" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="900">Evidence First. AI Second.</text>
  <text x="65" y="614" fill="#b9c8e7" font-family="Segoe UI,Arial,sans-serif" font-size="16">Open source   •   OpenTelemetry-native   •   Read-only by design</text>
</svg>